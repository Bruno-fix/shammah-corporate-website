<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none">
  <rect width="960" height="640" fill="#15171b"/>
  <g stroke="#23262c" stroke-width="1">
    <path d="M0 0H960M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960M0 400H960M0 440H960M0 480H960M0 520H960M0 560H960M0 600H960"/>
    <path d="M0 0V640M40 0V640M80 0V640M120 0V640M160 0V640M200 0V640M240 0V640M280 0V640M320 0V640M360 0V640M400 0V640M440 0V640M480 0V640M520 0V640M560 0V640M600 0V640M640 0V640M680 0V640M720 0V640M760 0V640M800 0V640M840 0V640M880 0V640M920 0V640M960 0V640"/>
  </g>

  <!-- Truss: top and bottom chords with triangulated web -->
  <g stroke="#5b6470" stroke-width="2.5" opacity="0.5">
    <line x1="80" y1="180" x2="880" y2="180"/>
    <line x1="80" y1="180" x2="880" y2="180" transform="translate(0,260)"/>
  </g>

  <g stroke="#fc4c04" stroke-width="3.5" stroke-linecap="round">
    <line x1="80" y1="240" x2="880" y2="240"/>
    <line x1="80" y1="400" x2="880" y2="400"/>
    <!-- verticals -->
    <line x1="160" y1="240" x2="160" y2="400"/>
    <line x1="320" y1="240" x2="320" y2="400"/>
    <line x1="480" y1="240" x2="480" y2="400"/>
    <line x1="640" y1="240" x2="640" y2="400"/>
    <line x1="800" y1="240" x2="800" y2="400"/>
    <!-- diagonals (W pattern) -->
    <line x1="80" y1="400" x2="160" y2="240"/>
    <line x1="160" y1="240" x2="320" y2="400"/>
    <line x1="320" y1="400" x2="480" y2="240"/>
    <line x1="480" y1="240" x2="640" y2="400"/>
    <line x1="640" y1="400" x2="800" y2="240"/>
    <line x1="800" y1="240" x2="880" y2="400"/>
  </g>

  <g fill="#fc4c04">
    <circle cx="80" cy="240" r="6"/>
    <circle cx="160" cy="240" r="6"/>
    <circle cx="320" cy="240" r="6"/>
    <circle cx="480" cy="240" r="6"/>
    <circle cx="640" cy="240" r="6"/>
    <circle cx="800" cy="240" r="6"/>
    <circle cx="880" cy="240" r="6"/>
    <circle cx="80" cy="400" r="6"/>
    <circle cx="160" cy="400" r="6"/>
    <circle cx="320" cy="400" r="6"/>
    <circle cx="480" cy="400" r="6"/>
    <circle cx="640" cy="400" r="6"/>
    <circle cx="800" cy="400" r="6"/>
    <circle cx="880" cy="400" r="6"/>
  </g>

  <g stroke="#fc4c04" stroke-width="1" opacity="0.8">
    <line x1="80" y1="450" x2="880" y2="450"/>
    <line x1="80" y1="442" x2="80" y2="458"/>
    <line x1="880" y1="442" x2="880" y2="458"/>
  </g>

  <path d="M960 640 L912 640 L960 592 Z" fill="#fc4c04"/>

  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" fill="#cfd3d8">
    <text x="32" y="600" font-size="20" letter-spacing="2" fill="#f5f4f1">COBERTURA EM TRELIÇA</text>
    <text x="32" y="624" font-size="13" letter-spacing="2" fill="#fc4c04">TIPO WARREN &#183; BANZOS PARALELOS &#183; NÓS SOLDADOS</text>
  </g>
</svg>
