<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none">
  <rect width="960" height="640" fill="#15171b"/>
  <g stroke="#23262c" stroke-width="1">
    <path d="M0 0H960M0 40H960M0 80H960M0 120H960M0 160H960M0 200H960M0 240H960M0 280H960M0 320H960M0 360H960M0 400H960M0 440H960M0 480H960M0 520H960M0 560H960M0 600H960"/>
    <path d="M0 0V640M40 0V640M80 0V640M120 0V640M160 0V640M200 0V640M240 0V640M280 0V640M320 0V640M360 0V640M400 0V640M440 0V640M480 0V640M520 0V640M560 0V640M600 0V640M640 0V640M680 0V640M720 0V640M760 0V640M800 0V640M840 0V640M880 0V640M920 0V640M960 0V640"/>
  </g>
  <line x1="0" y1="560" x2="960" y2="560" stroke="#3a3f47" stroke-width="2"/>

  <!-- Multi-storey steel frame: 4 bays x 6 floors -->
  <g stroke="#5b6470" stroke-width="2" opacity="0.6">
    <line x1="200" y1="80" x2="200" y2="560"/>
    <line x1="760" y1="80" x2="760" y2="560"/>
    <line x1="200" y1="80" x2="760" y2="80"/>
  </g>

  <g stroke="#fc4c04" stroke-width="2.5">
    <!-- columns -->
    <line x1="320" y1="80" x2="320" y2="560"/>
    <line x1="440" y1="80" x2="440" y2="560"/>
    <line x1="560" y1="80" x2="560" y2="560"/>
    <line x1="640" y1="80" x2="640" y2="560"/>
    <!-- floor beams -->
    <line x1="200" y1="160" x2="760" y2="160"/>
    <line x1="200" y1="240" x2="760" y2="240"/>
    <line x1="200" y1="320" x2="760" y2="320"/>
    <line x1="200" y1="400" x2="760" y2="400"/>
    <line x1="200" y1="480" x2="760" y2="480"/>
    <line x1="200" y1="560" x2="760" y2="560"/>
  </g>

  <g stroke="#fc4c04" stroke-width="1.5" opacity="0.55">
    <!-- bracing -->
    <line x1="200" y1="160" x2="320" y2="80"/>
    <line x1="320" y1="240" x2="440" y2="160"/>
    <line x1="440" y1="320" x2="560" y2="240"/>
    <line x1="640" y1="400" x2="760" y2="320"/>
    <line x1="200" y1="480" x2="320" y2="400"/>
    <line x1="640" y1="560" x2="760" y2="480"/>
  </g>

  <g stroke="#fc4c04" stroke-width="1" opacity="0.8">
    <line x1="200" y1="606" x2="760" y2="606"/>
    <line x1="200" y1="598" x2="200" y2="614"/>
    <line x1="760" y1="598" x2="760" y2="614"/>
  </g>

  <path d="M0 0 L48 0 L0 48 Z" fill="#fc4c04"/>

  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" fill="#cfd3d8">
    <text x="32" y="600" font-size="20" letter-spacing="2" fill="#f5f4f1">PRÉDIO MULTIANDAR</text>
    <text x="32" y="624" font-size="13" letter-spacing="2" fill="#fc4c04">ESTRUTURA METÁLICA &#183; 6 PAVIMENTOS &#183; CONTRAVENTAMENTO</text>
  </g>
</svg>
